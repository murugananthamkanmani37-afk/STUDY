<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyBuddy Chatbot</title>
<style>
  :root {
    --bg: #f4f2ff;
    --panel: #ffffff;
    --primary: #6c5ce7;
    --primary-dark: #4b3fc0;
    --user-bubble: #6c5ce7;
    --bot-bubble: #f1eefe;
    --text-main: #2b2350;
    --text-muted: #8880ad;
    --border: #e3ddfb;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, #f4f2ff 0%, #e9e4fb 100%);
    color: var(--text-main);
  }

  .app-shell {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .chat-card {
    width: 100%;
    max-width: 480px;
    height: min(720px, 92vh);
    background: var(--panel);
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 22px 55px rgba(76, 63, 192, 0.2);
    border: 1px solid #e3ddfb;
  }

  .chat-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 20px;
    background: linear-gradient(120deg, var(--primary), var(--primary-dark));
    color: #fff;
  }

  .brand-mark {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .brand-text h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
  }

  .brand-text p {
    margin: 2px 0 0;
    font-size: 12px;
    color: #ded9fb;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #7bf3a0;
    display: inline-block;
    box-shadow: 0 0 6px #7bf3a0;
  }

  .chat-body {
    position: relative;
    flex: 1;
    overflow: hidden;
  }

  .chat-messages {
    height: 100%;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }

  .chat-messages::-webkit-scrollbar {
    width: 8px;
  }
  .chat-messages::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 10px;
  }

  .msg-row {
    display: flex;
    max-width: 85%;
  }

  .msg-row.user {
    align-self: flex-end;
    justify-content: flex-end;
  }

  .msg-row.bot {
    align-self: flex-start;
  }

  .bubble {
    padding: 11px 15px;
    border-radius: 15px;
    font-size: 14.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .msg-row.user .bubble {
    background: var(--user-bubble);
    color: #ffffff;
    border-bottom-right-radius: 4px;
  }

  .msg-row.bot .bubble {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    color: var(--text-main);
    border-bottom-left-radius: 4px;
  }

  .typing-row .bubble {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 13px 16px;
  }

  .typing-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-dot:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .scroll-btn {
    position: absolute;
    bottom: 16px;
    right: 16px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(108, 92, 231, 0.35);
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .scroll-btn.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  .chat-input-area {
    display: flex;
    gap: 10px;
    padding: 16px;
    border-top: 1px solid var(--border);
    background: #f9f8ff;
  }

  #userInput {
    flex: 1;
    resize: none;
    max-height: 100px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: #ffffff;
    color: var(--text-main);
    padding: 11px 14px;
    font-size: 14.5px;
    font-family: inherit;
    outline: none;
  }

  #userInput:focus {
    border-color: var(--primary);
  }

  #sendBtn {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    font-size: 17px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease;
  }

  #sendBtn:active {
    transform: scale(0.92);
  }

  #sendBtn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .hint-text {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    padding: 0 16px 12px;
    background: #f9f8ff;
  }
</style>
</head>
<body>

<div class="app-shell">
  <div class="chat-card">

    <div class="chat-header">
      <div class="brand-mark">📚</div>
      <div class="brand-text">
        <h1>StudyBuddy</h1>
        <p><span class="status-dot"></span>Your study companion</p>
      </div>
    </div>

    <div class="chat-body">
      <div class="chat-messages" id="chatMessages">
        <div class="msg-row bot">
          <div class="bubble">Hi! I'm StudyBuddy 📚 Ask me about school or college subjects, concepts you're stuck on, exam prep, or study techniques.</div>
        </div>
      </div>
      <button class="scroll-btn" id="scrollBtn" title="Jump to latest message">↓</button>
    </div>

    <div class="chat-input-area">
      <textarea id="userInput" rows="1" placeholder="Ask a study question..."></textarea>
      <button id="sendBtn">➤</button>
    </div>
    <div class="hint-text">StudyBuddy only answers study and academic questions.</div>

  </div>
</div>

<script>
  const chatMessages = document.getElementById("chatMessages");
  const userInput = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");
  const scrollBtn = document.getElementById("scrollBtn");

  // Keeps the conversation so far, sent to the server on every request
  // so Gemini has context of the chat.
  let history = [];

  const NEAR_BOTTOM_THRESHOLD = 80;

  function isNearBottom() {
    const distance =
      chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight;
    return distance < NEAR_BOTTOM_THRESHOLD;
  }

  function scrollToBottom(smooth = true) {
    chatMessages.scrollTo({
      top: chatMessages.scrollHeight,
      behavior: smooth ? "smooth" : "auto",
    });
  }

  function updateScrollButtonVisibility() {
    scrollBtn.classList.toggle("visible", !isNearBottom());
  }

  chatMessages.addEventListener("scroll", updateScrollButtonVisibility);
  scrollBtn.addEventListener("click", () => scrollToBottom(true));

  function addMessage(role, text) {
    const wasNearBottom = isNearBottom();

    const row = document.createElement("div");
    row.className = `msg-row ${role === "user" ? "user" : "bot"}`;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    row.appendChild(bubble);
    chatMessages.appendChild(row);

    // Auto-scroll only if the user was already viewing the latest messages,
    // so we don't yank them down while they're reading older ones.
    if (wasNearBottom) {
      scrollToBottom(true);
    } else {
      updateScrollButtonVisibility();
    }
  }

  function showTypingIndicator() {
    const row = document.createElement("div");
    row.className = "msg-row bot typing-row";
    row.id = "typingRow";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML =
      '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';

    row.appendChild(bubble);
    chatMessages.appendChild(row);

    if (isNearBottom()) scrollToBottom(true);
  }

  function removeTypingIndicator() {
    const row = document.getElementById("typingRow");
    if (row) row.remove();
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    addMessage("user", text);
    userInput.value = "";
    userInput.style.height = "auto";
    sendBtn.disabled = true;
    showTypingIndicator();

    try {
      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history }),
      });

      const data = await response.json();
      removeTypingIndicator();

      if (!response.ok) {
        addMessage("bot", data.error || "Something went wrong. Please try again.");
        return;
      }

      addMessage("bot", data.reply);
      history.push({ role: "user", text });
      history.push({ role: "model", text: data.reply });
    } catch (err) {
      removeTypingIndicator();
      addMessage("bot", "I couldn't reach the server. Please check your connection and try again.");
    } finally {
      sendBtn.disabled = false;
      userInput.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);

  userInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  userInput.addEventListener("input", () => {
    userInput.style.height = "auto";
    userInput.style.height = Math.min(userInput.scrollHeight, 100) + "px";
  });

  updateScrollButtonVisibility();
</script>

</body>
</html>
